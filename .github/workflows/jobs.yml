# Scheduled jobs: Render's free tier has no cron, so GitHub Actions calls the secured job endpoints.
# Repository secrets: API_URL (e.g. https://attendance-api.onrender.com) and JOB_SECRET (same value as on Render).
name: Scheduled jobs

on:
  schedule:
    - cron: '7 * * * *' # hourly: close missed punches, fill in punch addresses
    - cron: '30 19 * * *' # 01:00 IST daily: finalise day statuses, clean up old data
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Space-separated job names'
        default: 'close-missed-punches geocode-pending daily-status cleanup'

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake the API (free instances sleep after 15 min idle)
        run: curl -fsS --retry 12 --retry-delay 10 --retry-all-errors --max-time 60 "$API_URL/healthz"
        env:
          API_URL: ${{ secrets.API_URL }}

      - name: Run jobs
        env:
          API_URL: ${{ secrets.API_URL }}
          JOB_SECRET: ${{ secrets.JOB_SECRET }}
          JOBS: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.jobs
              || github.event.schedule == '30 19 * * *' && 'daily-status cleanup'
              || 'close-missed-punches geocode-pending' }}
        run: |
          for job in $JOBS; do
            echo "::group::$job"
            curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 120 \
              -X POST -H "x-job-secret: $JOB_SECRET" "$API_URL/api/v1/internal/jobs/$job"
            echo
            echo "::endgroup::"
          done
